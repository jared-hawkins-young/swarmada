# Ruff configuration for swarmada-sidecar
line-length = 100
target-version = "py312"
extend-exclude = [
    "examples/*/src/*/proto_gen",
    ".venv",
    "build",
    "dist",
]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "N",    # pep8-naming
    "TCH",  # flake8-type-checking
    "PL",   # pylint (subset)
]
ignore = [
    "E501",   # line-length; handled by formatter
    "PLR0913", # too-many-arguments (LangGraph nodes legitimately take many)
]

[format]
quote-style = "double"
indent-style = "space"
